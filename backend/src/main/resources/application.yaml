server:
  port: 8080

spring:
  application:
    name: yourenglishsucks-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:yourenglishsucks;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# Gemini API 配置 (未配置時自動採用 Mock AI 模式，專注於測試使用情境之輸入與輸出)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  mock: ${GEMINI_MOCK:false}
  temperature: ${GEMINI_TEMPERATURE:0.55}
  top-p: ${GEMINI_TOP_P:0.95}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1000}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/yourenglishsucks
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
